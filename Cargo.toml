[package]
name = "cobserve"
version = "0.1.0"
edition = "2024"
description = "Co-observe your data fleet from the terminal: every ClickHouse node and the Redash queue at a glance — who is using what, and what it means — with Claude Code, OpenCode, a shell and a SQL console beside it. Read-only by design."

[dependencies]
color-eyre = "0.6.5"
crossterm = { version = "0.29", features = ["event-stream"] }
ratatui = "0.30.2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal", "process", "io-util"] }
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
# Already in the tree through ratatui; used directly so padding agrees with what the
# terminal draws when a person, a node or a piece of SQL has wide characters in it.
unicode-width = "0.2"
# The --credential file. serde_yaml's maintained fork; asked for a string, it hands over a
# YAML scalar as the text it is, so `password: 007` stays "007".
serde_norway = "0.9"
portable-pty = "0.9"
vt100 = "0.16"
shell-words = "1"
iana-time-zone = "0.1"
uuid = { version = "1", features = ["v4"] }
chrono = "0.4.45"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }

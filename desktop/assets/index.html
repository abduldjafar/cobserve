<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>cobserve</title>
<style>/*XTERM_CSS*/</style>
<style>/*FONTS*/</style>
<style>
  /* The window: a header of the app's own over a panel holding the terminal. Colours come from
     the look (Tarum's soga or mori, or an iTerm2 profile); severity alone colours a chip, as on
     cobserve's screen. The frame is a step lighter than the terminal (darker on mori), so the
     screen sits in it as in a case; it moves a little — the live mark breathes while all is
     well, the thread of tarum slides to the tab on screen, a chip that changed settles — and is
     still under reduced motion. The type is Maple Mono, rounded and quiet (a 600 bold, not a
     700); the name keeps Recursive's casual, like a line drawn with a canting. */
  :root {
    --bg: #2c2622; --fg: #eee4d2; --accent: #aeacf4; --crit: #f5725f; --warn: #f0b438; --ok: #8fcf9c;
    --chrome: #372f2a;
    --line: color-mix(in srgb, var(--fg) 9%, transparent);
    --muted: color-mix(in srgb, var(--fg) 58%, transparent);
    --faint: color-mix(in srgb, var(--fg) 36%, transparent);
    --hover: color-mix(in srgb, var(--fg) 7%, transparent);
    --ui: "Recursive", -apple-system, BlinkMacSystemFont, sans-serif;
    --mono: "Maple Mono", ui-monospace, Menlo, monospace;
  }
  html, body { margin: 0; height: 100%; background: var(--chrome); overflow: hidden; color: var(--fg); font: 12.5px/1 var(--ui); font-variation-settings: "CASL" 0, "MONO" 0; -webkit-user-select: none; user-select: none; }

  /* -- the header: the title bar's height; the traffic lights on its left -------------------
     Words, not widgets: the tabs are cobserve's own masthead — a number and a name — and the
     one on screen has a thread of tarum under it. */
  #bar { position: absolute; top: 0; left: 0; right: 0; height: 44px; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 14px; padding: 0 18px 0 84px; box-sizing: border-box; }
  .brand { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 13.5px; white-space: nowrap; justify-self: start; font-variation-settings: "CASL" 1, "MONO" 0; }
  .brand svg { width: 15px; height: 15px; }
  .mark { font-family: var(--mono); font-size: 12px; font-weight: 600; color: var(--faint); }
  .mark.ok { color: var(--ok); } .mark.warn { color: var(--warn); } .mark.crit { color: var(--crit); }
  #pulse.ok { animation: breathe 2.6s ease-in-out infinite; }
  @keyframes breathe { 0%, 100% { opacity: .55; } 50% { opacity: 1; } }

  .tabs { position: relative; display: flex; gap: 12px; font-family: var(--mono); font-size: 13px; height: 44px; align-items: stretch; }
  .tab { display: flex; align-items: center; gap: 6px; color: var(--muted); cursor: default; position: relative; white-space: nowrap; margin: 9px 0; padding: 0 8px; border-radius: 6px; transition: color .15s, background-color .15s; }
  .tab .num { color: var(--faint); }
  .tab:hover { color: var(--fg); background: var(--hover); }
  .tab.on { color: var(--fg); font-weight: 600; }
  .tab.on .num { color: var(--accent); }
  .tabs .thread { position: absolute; bottom: 5px; height: 2px; background: var(--accent); border-radius: 1px; opacity: 0;
    transition: left .22s cubic-bezier(.2, .7, .2, 1), width .22s cubic-bezier(.2, .7, .2, 1), opacity .15s; }
  .tab .count { color: var(--faint); font-weight: 400; }
  .tab.calling .name { color: var(--warn); }
  .tab .ring { color: var(--warn); font-size: 9px; }

  /* -- the selvedge: the edge of the cloth, along the bottom ---------------------------------
     One line of text, as a terminal's status line is: each thing watched with cobserve's own
     mark for how it is (✖ ▲ ●, coloured as on screen), its name, its few words; hairlines
     between. Woven along its top edge, faintly, a stripe of tarum and mori. */
  #status { position: absolute; left: 0; right: 0; bottom: 0; height: 30px; display: flex; align-items: center; gap: 0; padding: 0 18px; box-sizing: border-box; font-family: var(--mono); font-size: 12.5px; }
  #status::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 2px; opacity: .55;
    background: repeating-linear-gradient(90deg, color-mix(in srgb, var(--accent) 70%, transparent) 0 7px, transparent 7px 10px, color-mix(in srgb, var(--fg) 30%, transparent) 10px 12px, transparent 12px 15px); }
  .chips { display: flex; overflow: hidden; flex: 1; min-width: 0; align-items: center; }
  .chip { display: flex; align-items: baseline; gap: 7px; padding: 0 14px; white-space: nowrap; cursor: default; border-left: 1px solid var(--line); line-height: 30px; }
  .chip:first-child { padding-left: 0; border-left: none; }
  .chip .mark { font-size: 11px; }
  .chip .label { color: var(--muted); }
  .chip .text { color: var(--fg); border-radius: 4px; transition: color .25s; }
  .chip.changed .text { animation: settle .9s ease-out; }
  @keyframes settle { from { background: var(--hover); } to { background: transparent; } }
  .chip.crit .text { color: var(--crit); }
  .chip:hover .label, .chip:hover .text { text-decoration: underline; text-decoration-color: var(--faint); text-underline-offset: 3px; }
  .chip.state .text { color: var(--warn); }
  .aside { display: flex; align-items: center; gap: 14px; color: var(--faint); white-space: nowrap; font-style: italic; font-variation-settings: "CASL" 1, "MONO" 1; }
  .aside b { color: var(--muted); font-weight: 400; font-style: normal; }

  .clock { text-align: right; white-space: nowrap; line-height: 1.3; justify-self: end; font-family: var(--mono); }
  .clock .time { font-weight: 600; font-size: 13px; }
  .clock .zone { color: var(--muted); font-size: 11px; margin-left: 4px; }
  .clock .next { color: var(--faint); font-size: 11px; }

  /* -- the panel: the terminal, laid on the window, a hairline round it ---------------------- */
  #panel { position: absolute; top: 44px; left: 10px; right: 10px; bottom: 32px; border-radius: 6px; background: var(--bg); border: 1px solid var(--line); overflow: hidden; }
  #screen { position: absolute; inset: 10px 8px 8px 12px; }
  .xterm .xterm-viewport { background: var(--bg) !important; overflow-y: hidden !important; }
  /* Maple's cv02: the `a` with its arm, calmer than the single-storey one. */
  .xterm, .tabs, #status, .clock { font-feature-settings: "liga" 0, "calt" 0, "cv02" 1; }
  .xterm { -webkit-font-smoothing: antialiased; }

  @media (prefers-reduced-motion: reduce) {
    #pulse.ok, .chip.changed .text { animation: none; }
    .tab, .tabs .thread, .chip .text { transition: none; }
  }

  /* A narrower window: the hint goes, then the aside, the names in the selvedge, the tabs' names. */
  @media (max-width: 1640px) { .aside .hint { display: none; } }
  @media (max-width: 1320px) { .aside { display: none; } }
  @media (max-width: 1180px) { .chip .label { display: none; } }
  @media (max-width: 1080px) { .tab .name { display: none; } .tabs { gap: 4px; } }
  @media (max-width: 820px) { .chip:not(.crit):not(.state) { display: none; } .clock .next { display: none; } }
  @media (max-width: 700px) { .brand .word { display: none; } }
</style>
</head>
<body>
<header id="bar">
  <div class="brand">
    <!-- The icon's lighthouse at 15 px: tower and cap, the kunyit lamp, the tarum sea, one gap
         for the discs. No red: the mark beside it says how things are. -->
    <svg viewBox="0 0 16 16"><rect x="0" y="13" width="16" height="3" rx="1" fill="var(--accent)"/><path d="M5.5 13 L6.3 6.5 H9.7 L10.5 13 Z" fill="var(--fg)"/><rect x="6.4" y="4.4" width="3.2" height="2.1" fill="var(--warn)"/><path d="M4.8 4.4 L8 1.4 L11.2 4.4 Z" fill="var(--fg)"/><rect x="6.1" y="9.6" width="3.8" height="0.8" fill="var(--chrome)"/></svg>
    <span class="word">cobserve</span>
    <span class="mark" id="pulse"></span>
  </div>
  <nav class="tabs" id="tabs"></nav>
  <div class="clock" id="clock"><div><span class="time"></span><span class="zone"></span></div><div class="next"></div></div>
</header>
<main id="panel"><div id="screen"></div></main>
<footer id="status">
  <div class="chips" id="chips"></div>
  <div class="aside"><span class="hint"><b>⌘1–9</b> panels · <b>⌘±</b> size · <b>⌥ drag</b> select</span><span>read-only on ClickHouse</span></div>
</footer>
<script>/*XTERM_JS*/</script>
<script>/*FIT_JS*/</script>
<script>/*UNICODE11_JS*/</script>
<script>/*WEBGL_JS*/</script>
<script>
(() => {
  const post = (message) => window.ipc.postMessage(JSON.stringify(message));
  // What goes wrong here is said to the app, which writes it to its standard error.
  window.addEventListener("error", (e) => post({ t: "log", d: `${e.message} (${e.filename}:${e.lineno})` }));

  // Your iTerm2 profile's font and colours, as the app read them.
  const look = /*LOOK*/;
  const a = look.ansi;
  const root = document.documentElement.style;
  root.setProperty("--bg", look.background);
  root.setProperty("--fg", look.foreground);
  root.setProperty("--accent", a[4]);
  root.setProperty("--crit", a[1]);
  root.setProperty("--warn", a[3]);
  root.setProperty("--ok", a[2]);
  // An iTerm2 profile's colours bring no frame: it is mixed from their ground.
  root.setProperty("--chrome", look.chrome || `color-mix(in srgb, ${look.background} 82%, ${look.light ? "white" : "black"})`);

  // A page with no origin may keep no storage: the size is then the profile's each time.
  const store = {
    get: (k) => { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set: (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} },
  };
  const saved = Number(store.get("fontSize"));
  const term = new Terminal({
    // Maple Mono for the letters, the frames and the graphs; the icons a prompt draws (Starship,
    // powerline) from a Nerd Font on the machine, which Maple Mono does not carry.
    fontFamily: `"${look.font}", "Maple Mono", "Symbols Nerd Font Mono", "JetBrainsMono Nerd Font Mono", "JetBrainsMono Nerd Font", "JetBrainsMono NF", "Hack Nerd Font", "MesloLGS NF", ui-monospace, "SF Mono", Menlo, monospace`,
    fontSize: saved >= 9 && saved <= 28 ? saved : look.size,
    fontWeight: "400",
    fontWeightBold: "600",
    lineHeight: 1.0,
    letterSpacing: 0,
    allowProposedApi: true,
    // Block and box glyphs drawn to the cell, as cobserve's bars and rules need: no seams.
    customGlyphs: true,
    rescaleOverlappingGlyphs: true,
    cursorBlink: look.cursor_blink,
    cursorStyle: look.cursor_style,
    scrollback: 0,
    macOptionIsMeta: true,
    // cobserve takes the mouse; ⌥ and a drag selects text anyway.
    macOptionClickForcesSelection: true,
    drawBoldTextInBrightColors: false,
    minimumContrastRatio: 1,
    theme: {
      background: look.background, foreground: look.foreground,
      cursor: look.cursor, cursorAccent: look.cursor_text,
      selectionBackground: look.selection, selectionForeground: look.selected_text,
      black: a[0], red: a[1], green: a[2], yellow: a[3], blue: a[4], magenta: a[5], cyan: a[6], white: a[7],
      brightBlack: a[8], brightRed: a[9], brightGreen: a[10], brightYellow: a[11],
      brightBlue: a[12], brightMagenta: a[13], brightCyan: a[14], brightWhite: a[15],
    },
  });
  const fit = new FitAddon.FitAddon();
  term.loadAddon(fit);
  const unicode = new Unicode11Addon.Unicode11Addon();
  term.loadAddon(unicode);
  term.unicode.activeVersion = "11";
  term.open(document.getElementById("screen"));
  // WebGL by default: the GPU draws the cells, where the web view's own text layout costs
  // several times the energy while sessions talk. `COBSERVE_RENDERER=dom` for the system's text;
  // a lost GPU context falls back to it by itself.
  if (look.renderer === "webgl") {
    try {
      const webgl = new WebglAddon.WebglAddon();
      webgl.onContextLoss(() => webgl.dispose());
      term.loadAddon(webgl);
    } catch (e) {}
  }

  // -- the header ---------------------------------------------------------------------------
  // The panels, as cobserve numbers them; a tab sends the F-key that zooms it from anywhere, a
  // session's screen included (F1–F8; F10 this machine).
  const views = [
    { id: "fleet", name: "Fleet", key: "\x1bOP" },
    { id: "queue", name: "Queue", key: "\x1bOQ" },
    { id: "nodes", name: "Nodes", key: "\x1bOR" },
    { id: "node", name: "Node", key: "\x1bOS" },
    { id: "airflow", name: "Airflow", key: "\x1b[15~" },
    { id: "jira", name: "Jira", key: "\x1b[17~" },
    { id: "tape", name: "Tape", key: "\x1b[18~" },
    { id: "sessions", name: "Sessions", key: "\x1b[19~" },
    // This machine: cobserve's `0`, F10 — beside the sessions, where the work is.
    { id: "local", name: "Local", num: 0, key: "\x1b[21~" },
  ];
  // The number cobserve gives a panel (its chips say which they open): 1–8, and 0.
  const byNumber = (n) => views.find((v, i) => (v.num ?? i + 1) === n);
  const tabs = document.getElementById("tabs");
  const go = (key) => { post({ t: "in", d: key }); term.focus(); };
  for (const [i, v] of views.entries()) {
    const tab = document.createElement("div");
    tab.className = "tab";
    tab.dataset.view = v.id;
    tab.title = `${v.name} · ⌘${i + 1}`;
    tab.innerHTML = `<span class="num">${v.num ?? i + 1}</span><span class="name">${v.name.toLowerCase()}</span>`;
    tab.addEventListener("click", () => go(v.key));
    tabs.appendChild(tab);
  }
  // The thread of tarum under the tab on screen: one, sliding to it.
  const thread = document.createElement("div");
  thread.className = "thread";
  tabs.appendChild(thread);
  const placeThread = () => {
    const on = tabs.querySelector(".tab.on");
    thread.style.opacity = on && on.offsetWidth ? "1" : "0";
    if (on && on.offsetWidth) {
      thread.style.left = `${on.offsetLeft + 8}px`;
      thread.style.width = `${on.offsetWidth - 16}px`;
    }
  };
  new ResizeObserver(placeThread).observe(tabs);
  // What each chip said the frame before and when it last changed, so the one that changed can
  // settle — across frames, which come faster than the settling and draw the chips anew.
  let said = new Map();
  const changedAt = new Map();
  const chips = document.getElementById("chips");
  // How a thing is, in the marks cobserve's own screen uses.
  const glyph = { crit: "✖", warn: "▲", ok: "●", none: "·" };
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  // What cobserve says after a frame: the view on screen, the chips, the clock (desktop.rs).
  const render = (s) => {
    const pulse = document.getElementById("pulse");
    pulse.className = `mark ${s.status}`;
    pulse.textContent = glyph[s.status] ?? "·";
    for (const tab of tabs.querySelectorAll(".tab")) {
      tab.classList.toggle("on", tab.dataset.view === s.view);
      tab.querySelector(".count")?.remove();
      tab.querySelector(".ring")?.remove();
      if (tab.dataset.view === "sessions") {
        if (s.sessions > 0) tab.insertAdjacentHTML("beforeend", `<span class="count">·${s.sessions}</span>`);
        tab.classList.toggle("calling", s.calling);
        if (s.calling) tab.insertAdjacentHTML("beforeend", `<span class="ring">●</span>`);
      }
    }
    const states = [];
    const state = (mark, text) => `<div class="chip state"><span class="mark warn">${mark}</span><span class="text">${text}</span></div>`;
    if (s.paused) states.push(state("○", "paused"));
    if (s.stale) states.push(state("◌", "stale"));
    if (s.filter) states.push(state("/", esc(s.filter)));
    chips.innerHTML = states.join("") + s.chips
      .map((c) => `<div class="chip ${c.sev}" data-view="${c.view}" title="${esc(c.label)}: ${esc(c.text)}"><span class="mark ${c.sev}">${glyph[c.sev] ?? "·"}</span><span class="label">${esc(c.label.toLowerCase())}</span><span class="text">${esc(c.text)}</span></div>`)
      .join("");
    const now = new Map();
    for (const chip of chips.querySelectorAll("[data-view]")) {
      const label = chip.querySelector(".label").textContent, text = chip.querySelector(".text").textContent;
      now.set(label, text);
      if (said.has(label) && said.get(label) !== text) changedAt.set(label, performance.now());
      const since = performance.now() - (changedAt.get(label) ?? -1e9);
      if (since < 900) {
        chip.classList.add("changed");
        chip.querySelector(".text").style.animationDelay = `-${Math.round(since)}ms`;
      }
    }
    said = now;
    placeThread();
    for (const chip of chips.querySelectorAll("[data-view]")) {
      const view = byNumber(Number(chip.dataset.view));
      if (view) chip.addEventListener("click", () => go(view.key));
    }
    fitChips();
    const clock = document.getElementById("clock");
    clock.querySelector(".time").textContent = s.clock;
    clock.querySelector(".zone").textContent = s.zone;
    clock.querySelector(".next").textContent = s.next;
  };
  // A chip that does not fit whole is left out whole, never cut — the first ones are the fleet's.
  const fitChips = () => {
    const room = chips.clientWidth;
    for (const chip of chips.children) chip.style.display = "";
    for (const chip of chips.children) {
      if (chip.offsetLeft - chips.offsetLeft + chip.offsetWidth > room) chip.style.display = "none";
    }
  };
  new ResizeObserver(fitChips).observe(chips);
  term.parser.registerOscHandler(7700, (data) => {
    try { render(JSON.parse(data)); } catch (e) {}
    return true;
  });

  // The header's empty space moves the window, as a title bar does; twice zooms it.
  const bar = document.getElementById("bar");
  bar.addEventListener("mousedown", (e) => {
    if (e.button !== 0 || e.detail !== 1 || e.target.closest(".tab, .chip")) return;
    post({ t: "drag" });
  });
  bar.addEventListener("dblclick", (e) => { if (!e.target.closest(".tab, .chip")) post({ t: "zoom" }); });

  let size = { cols: 0, rows: 0 };
  const refit = () => {
    fit.fit();
    if (term.cols !== size.cols || term.rows !== size.rows) {
      size = { cols: term.cols, rows: term.rows };
      post({ t: "resize", cols: term.cols, rows: term.rows });
    }
  };
  new ResizeObserver(refit).observe(document.getElementById("screen"));
  // A font that arrives after the first fit changes the cell, not the panel. xterm measures its
  // cell when the font changes, so it is changed and changed back, then fitted again.
  const remeasure = () => {
    const family = term.options.fontFamily;
    term.options.fontFamily = `${family}, monospace`;
    term.options.fontFamily = family;
    refit();
  };
  document.fonts.addEventListener("loadingdone", remeasure);
  setTimeout(remeasure, 300);
  setTimeout(remeasure, 1200);

  term.onData((d) => post({ t: "in", d }));
  // Old-style mouse reports are bytes, not text.
  term.onBinary((d) => post({ t: "bin", d: Array.from(d, (c) => c.charCodeAt(0) & 255) }));
  term.onTitleChange((d) => post({ t: "title", d }));

  // ⌘1–⌘9 the panels, as the tabs (⌘9 this machine); ⌘+ ⌘− ⌘0 the type's size, kept for the next start.
  window.addEventListener("keydown", (e) => {
    if (!e.metaKey || e.ctrlKey || e.altKey) return;
    const n = Number(e.key);
    if (n >= 1 && n <= views.length) {
      e.preventDefault();
      go(views[n - 1].key);
      return;
    }
    const step = { "=": 1, "+": 1, "-": -1, "0": 0 }[e.key];
    if (step === undefined) return;
    e.preventDefault();
    const next = step === 0 ? look.size : Math.min(28, Math.max(9, term.options.fontSize + step));
    term.options.fontSize = next;
    store.set("fontSize", String(next));
    refit();
  }, true);

  // What the program printed, base64, from the app.
  window.out = (b64) => {
    const bin = atob(b64);
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    term.write(bytes);
  };
  // Files dropped on the window, their paths escaped: in as a paste — bracketed when the program
  // asked for that, so Claude Code takes a picture's path as the picture.
  window.dropped = (text) => { term.focus(); term.paste(text); };
  // The program ended: what it said stays on screen, the window closes behind it.
  window.ended = (why) => term.write(`\r\n\x1b[2m${why}\x1b[0m\r\n`);

  // Fonts first, so the first size is the right one; then cobserve is started at it.
  document.fonts.ready.then(() => {
    fit.fit();
    size = { cols: term.cols, rows: term.rows };
    term.focus();
    post({ t: "ready", cols: term.cols, rows: term.rows });
  });
  window.addEventListener("focus", () => term.focus());
})();
</script>
</body>
</html>

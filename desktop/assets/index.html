<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>cobserve</title>
<style>/*XTERM_CSS*/</style>
<style>
  /* The window: a header of the app's own over a panel holding the terminal. Colours come from
     the look (your iTerm2 profile); severity alone colours a chip, as on cobserve's screen. */
  :root {
    --bg: #1a1b26; --fg: #c0caf5; --accent: #7aa2f7; --crit: #f7768e; --warn: #e0af68; --ok: #9ece6a;
    --chrome: color-mix(in srgb, var(--bg) 82%, black);
    --line: color-mix(in srgb, var(--fg) 9%, transparent);
    --muted: color-mix(in srgb, var(--fg) 55%, transparent);
    --faint: color-mix(in srgb, var(--fg) 32%, transparent);
    --hover: color-mix(in srgb, var(--fg) 7%, transparent);
    --ui: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", "Helvetica Neue", sans-serif;
  }
  html, body { margin: 0; height: 100%; background: var(--chrome); overflow: hidden; color: var(--fg); font: 12.5px/1 var(--ui); -webkit-user-select: none; user-select: none; }

  /* -- the header: the title bar's height and then some; the traffic lights on its left ------ */
  #bar { position: absolute; top: 0; left: 0; right: 0; height: 46px; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 14px; padding: 0 16px 0 84px; box-sizing: border-box; }
  .brand { display: flex; align-items: center; gap: 8px; font-weight: 650; letter-spacing: .2px; font-size: 13.5px; white-space: nowrap; justify-self: start; }
  .brand svg { width: 15px; height: 15px; }
  .pulse { width: 7px; height: 7px; border-radius: 50%; background: var(--faint); }
  .pulse.ok { background: var(--ok); } .pulse.warn { background: var(--warn); }
  .pulse.crit { background: var(--crit); box-shadow: 0 0 0 3px color-mix(in srgb, var(--crit) 25%, transparent); }

  .tabs { display: flex; gap: 2px; padding: 3px; border-radius: 10px; background: color-mix(in srgb, var(--fg) 5%, transparent); border: 1px solid var(--line); }
  .tab { display: flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border-radius: 7px; color: var(--muted); cursor: default; position: relative; white-space: nowrap; transition: background .12s, color .12s; }
  .tab svg { width: 15px; height: 15px; flex: none; }
  .tab:hover { background: var(--hover); color: var(--fg); }
  .tab.on { background: color-mix(in srgb, var(--accent) 18%, transparent); color: var(--accent); font-weight: 600; transition: none; }
  .tab .count { font-size: 10.5px; padding: 1px 5px; border-radius: 6px; background: var(--line); color: var(--muted); font-weight: 600; }
  .tab .ring { position: absolute; top: 4px; right: 4px; width: 6px; height: 6px; border-radius: 50%; background: var(--warn); }

  /* -- the status bar: each thing watched as a chip; a click opens its view ----------------- */
  #status { position: absolute; left: 10px; right: 10px; bottom: 0; height: 36px; display: flex; align-items: center; gap: 6px; }
  .chips { display: flex; gap: 6px; overflow: hidden; flex: 1; min-width: 0; }
  .aside { display: flex; align-items: center; gap: 12px; color: var(--faint); font-size: 11.5px; white-space: nowrap; }
  .aside b { color: var(--muted); font-weight: 600; }
  .chip { display: flex; align-items: center; gap: 7px; height: 24px; padding: 0 10px; border-radius: 7px; border: 1px solid var(--line); background: color-mix(in srgb, var(--fg) 3%, transparent); white-space: nowrap; cursor: default; transition: background .12s; }
  .chip:hover { background: var(--hover); }
  .chip .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--faint); flex: none; }
  .chip .label { color: var(--muted); font-weight: 600; font-size: 11px; letter-spacing: .3px; text-transform: uppercase; }
  .chip .text { color: var(--fg); font-variant-numeric: tabular-nums; }
  .chip.ok .dot { background: var(--ok); } .chip.warn .dot { background: var(--warn); } .chip.crit .dot { background: var(--crit); }
  .chip.warn { border-color: color-mix(in srgb, var(--warn) 35%, transparent); }
  .chip.crit { border-color: color-mix(in srgb, var(--crit) 45%, transparent); background: color-mix(in srgb, var(--crit) 9%, transparent); }
  .chip.state { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 35%, transparent); font-weight: 600; }

  .clock { text-align: right; white-space: nowrap; line-height: 1.25; justify-self: end; }
  .clock .time { font-weight: 650; font-size: 13.5px; font-variant-numeric: tabular-nums; }
  .clock .zone { color: var(--muted); font-size: 11px; margin-left: 3px; }
  .clock .next { color: var(--faint); font-size: 11px; }

  /* -- the panel: the terminal, inset on the window with a hairline round it ---------------- */
  #panel { position: absolute; top: 46px; left: 10px; right: 10px; bottom: 36px; border-radius: 12px; background: var(--bg); border: 1px solid var(--line); box-shadow: 0 10px 30px rgba(0,0,0,.35), inset 0 1px 0 color-mix(in srgb, var(--fg) 4%, transparent); overflow: hidden; }
  #screen { position: absolute; inset: 10px 8px 8px 12px; }
  .xterm .xterm-viewport { background: var(--bg) !important; overflow-y: hidden !important; }
  .xterm { font-feature-settings: "liga" 0, "calt" 0; -webkit-font-smoothing: antialiased; }

  /* A narrower window: the tabs keep their icons, the chips their dot and words, then the worst. */
  @media (max-width: 1640px) { .aside .hint { display: none; } }
  @media (max-width: 1320px) { .aside { display: none; } }
  @media (max-width: 1180px) { .chip .label { display: none; } }
  @media (max-width: 1020px) { .tab .name { display: none; } .tab { padding: 0 8px; } }
  @media (max-width: 820px) { .chip:not(.crit):not(.state) { display: none; } .clock .next { display: none; } }
  @media (max-width: 700px) { .brand .word { display: none; } }
</style>
</head>
<body>
<header id="bar">
  <div class="brand">
    <svg viewBox="0 0 16 16"><path d="M8 1.5 14.5 8 8 14.5 1.5 8Z" fill="var(--accent)"/></svg>
    <span class="word">cobserve</span>
    <span class="pulse" id="pulse"></span>
  </div>
  <nav class="tabs" id="tabs"></nav>
  <div class="clock" id="clock"><div><span class="time"></span><span class="zone"></span></div><div class="next"></div></div>
</header>
<main id="panel"><div id="screen"></div></main>
<footer id="status">
  <div class="chips" id="chips"></div>
  <div class="aside"><span class="hint"><b>⌘1–8</b> views · <b>⌘±</b> size · <b>⌥ drag</b> select</span><span>read-only on ClickHouse</span></div>
</footer>
<script>/*XTERM_JS*/</script>
<script>/*FIT_JS*/</script>
<script>/*UNICODE11_JS*/</script>
<script>/*WEBGL_JS*/</script>
<script>
(() => {
  const post = (message) => window.ipc.postMessage(JSON.stringify(message));
  // What goes wrong here is said to the app, which writes it to its standard error.
  window.addEventListener("error", (e) => post({ t: "log", d: `${e.message} (${e.filename}:${e.lineno})` }));

  // Your iTerm2 profile's font and colours, as the app read them.
  const look = /*LOOK*/;
  const a = look.ansi;
  const root = document.documentElement.style;
  root.setProperty("--bg", look.background);
  root.setProperty("--fg", look.foreground);
  root.setProperty("--accent", a[4]);
  root.setProperty("--crit", a[1]);
  root.setProperty("--warn", a[3]);
  root.setProperty("--ok", a[2]);

  // A page with no origin may keep no storage: the size is then the profile's each time.
  const store = {
    get: (k) => { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set: (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} },
  };
  const saved = Number(store.get("fontSize"));
  const term = new Terminal({
    fontFamily: `"${look.font}", "JetBrainsMono Nerd Font", "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace`,
    fontSize: saved >= 9 && saved <= 28 ? saved : look.size,
    lineHeight: 1.0,
    letterSpacing: 0,
    allowProposedApi: true,
    // Block and box glyphs drawn to the cell, as cobserve's bars and rules need: no seams.
    customGlyphs: true,
    rescaleOverlappingGlyphs: true,
    cursorBlink: look.cursor_blink,
    cursorStyle: look.cursor_style,
    scrollback: 0,
    macOptionIsMeta: true,
    // cobserve takes the mouse; ⌥ and a drag selects text anyway.
    macOptionClickForcesSelection: true,
    drawBoldTextInBrightColors: false,
    minimumContrastRatio: 1,
    theme: {
      background: look.background, foreground: look.foreground,
      cursor: look.cursor, cursorAccent: look.cursor_text,
      selectionBackground: look.selection, selectionForeground: look.selected_text,
      black: a[0], red: a[1], green: a[2], yellow: a[3], blue: a[4], magenta: a[5], cyan: a[6], white: a[7],
      brightBlack: a[8], brightRed: a[9], brightGreen: a[10], brightYellow: a[11],
      brightBlue: a[12], brightMagenta: a[13], brightCyan: a[14], brightWhite: a[15],
    },
  });
  const fit = new FitAddon.FitAddon();
  term.loadAddon(fit);
  const unicode = new Unicode11Addon.Unicode11Addon();
  term.loadAddon(unicode);
  term.unicode.activeVersion = "11";
  term.open(document.getElementById("screen"));
  // The web view's own text by default, drawn by the system as iTerm2's is; WebGL when asked.
  if (look.renderer === "webgl") {
    try {
      const webgl = new WebglAddon.WebglAddon();
      webgl.onContextLoss(() => webgl.dispose());
      term.loadAddon(webgl);
    } catch (e) {}
  }

  // -- the header ---------------------------------------------------------------------------
  // The views, as cobserve numbers them; a tab sends the F-key cobserve takes for it from
  // anywhere, a session's screen included.
  const icon = (d) => `<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
  const views = [
    { id: "nodes", name: "Nodes", key: "\x1bOP", svg: icon('<rect x="2.5" y="2.5" width="11" height="4.5" rx="1.2"/><rect x="2.5" y="9" width="11" height="4.5" rx="1.2"/><path d="M5 4.75h.01M5 11.25h.01"/>') },
    { id: "queue", name: "Queue", key: "\x1bOQ", svg: icon('<path d="M6 4h7.5M6 8h7.5M6 12h7.5"/><path d="M2.75 4h.01M2.75 8h.01M2.75 12h.01"/>') },
    { id: "map", name: "Map", key: "\x1bOR", svg: icon('<rect x="2.5" y="2.5" width="4.5" height="4.5" rx="1"/><rect x="9" y="2.5" width="4.5" height="4.5" rx="1"/><rect x="2.5" y="9" width="4.5" height="4.5" rx="1"/><rect x="9" y="9" width="4.5" height="4.5" rx="1"/>') },
    { id: "tape", name: "Tape", key: "\x1bOS", svg: icon('<path d="M1.5 8h3l2-4.5 3 9 2-4.5h3"/>') },
    { id: "airflow", name: "Airflow", key: "\x1b[15~", svg: icon('<path d="M2 5.5h7.5a2 2 0 1 0-2-2"/><path d="M2 8.5h10.5a2 2 0 1 1-2 2"/><path d="M2 11.5h4"/>') },
    { id: "jira", name: "Jira", key: "\x1b[17~", svg: icon('<rect x="2.5" y="2.5" width="3" height="11" rx="1"/><rect x="6.5" y="2.5" width="3" height="7" rx="1"/><rect x="10.5" y="2.5" width="3" height="4.5" rx="1"/>') },
    { id: "sessions", name: "Sessions", key: "\x1b[18~", svg: icon('<path d="m3 5 3 3-3 3"/><path d="M8 11.5h5"/>') },
    // This machine: cobserve's `0`, F10 — beside the sessions, where the work is.
    { id: "local", name: "Local", num: 0, key: "\x1b[21~", svg: icon('<rect x="3" y="3" width="10" height="7" rx="1.2"/><path d="M1.5 13h13"/><path d="M5.5 7.5l1.5-1.5 1.5 1 2-2"/>') },
  ];
  // The number cobserve gives a view (its chips say which view they open): 1–7, and 0.
  const byNumber = (n) => views.find((v, i) => (v.num ?? i + 1) === n);
  const tabs = document.getElementById("tabs");
  const go = (key) => { post({ t: "in", d: key }); term.focus(); };
  for (const [i, v] of views.entries()) {
    const tab = document.createElement("div");
    tab.className = "tab";
    tab.dataset.view = v.id;
    tab.title = `${v.name} · ⌘${i + 1}`;
    tab.innerHTML = `${v.svg}<span class="name">${v.name}</span>`;
    tab.addEventListener("click", () => go(v.key));
    tabs.appendChild(tab);
  }
  const chips = document.getElementById("chips");
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  // What cobserve says after a frame: the view on screen, the chips, the clock (desktop.rs).
  const render = (s) => {
    document.getElementById("pulse").className = `pulse ${s.status}`;
    for (const tab of tabs.children) {
      tab.classList.toggle("on", tab.dataset.view === s.view);
      tab.querySelector(".count")?.remove();
      tab.querySelector(".ring")?.remove();
      if (tab.dataset.view === "sessions") {
        if (s.sessions > 0) tab.insertAdjacentHTML("beforeend", `<span class="count">${s.sessions}</span>`);
        if (s.calling) tab.insertAdjacentHTML("beforeend", `<span class="ring"></span>`);
      }
    }
    const states = [];
    if (s.paused) states.push(`<div class="chip state">paused</div>`);
    if (s.stale) states.push(`<div class="chip state">stale</div>`);
    if (s.filter) states.push(`<div class="chip state">/${esc(s.filter)}</div>`);
    chips.innerHTML = states.join("") + s.chips
      .map((c) => `<div class="chip ${c.sev}" data-view="${c.view}" title="${esc(c.label)}: ${esc(c.text)}"><span class="dot"></span><span class="label">${esc(c.label)}</span><span class="text">${esc(c.text)}</span></div>`)
      .join("");
    for (const chip of chips.querySelectorAll("[data-view]")) {
      const view = byNumber(Number(chip.dataset.view));
      if (view) chip.addEventListener("click", () => go(view.key));
    }
    fitChips();
    const clock = document.getElementById("clock");
    clock.querySelector(".time").textContent = s.clock;
    clock.querySelector(".zone").textContent = s.zone;
    clock.querySelector(".next").textContent = s.next;
  };
  // A chip that does not fit whole is left out whole, never cut — the first ones are the fleet's.
  const fitChips = () => {
    const room = chips.clientWidth;
    for (const chip of chips.children) chip.style.display = "";
    for (const chip of chips.children) {
      if (chip.offsetLeft - chips.offsetLeft + chip.offsetWidth > room) chip.style.display = "none";
    }
  };
  new ResizeObserver(fitChips).observe(chips);
  term.parser.registerOscHandler(7700, (data) => {
    try { render(JSON.parse(data)); } catch (e) {}
    return true;
  });

  // The header's empty space moves the window, as a title bar does; twice zooms it.
  const bar = document.getElementById("bar");
  bar.addEventListener("mousedown", (e) => {
    if (e.button !== 0 || e.detail !== 1 || e.target.closest(".tab, .chip")) return;
    post({ t: "drag" });
  });
  bar.addEventListener("dblclick", (e) => { if (!e.target.closest(".tab, .chip")) post({ t: "zoom" }); });

  let size = { cols: 0, rows: 0 };
  const refit = () => {
    fit.fit();
    if (term.cols !== size.cols || term.rows !== size.rows) {
      size = { cols: term.cols, rows: term.rows };
      post({ t: "resize", cols: term.cols, rows: term.rows });
    }
  };
  new ResizeObserver(refit).observe(document.getElementById("screen"));
  // A font that arrives after the first fit changes the cell, not the panel. xterm measures its
  // cell when the font changes, so it is changed and changed back, then fitted again.
  const remeasure = () => {
    const family = term.options.fontFamily;
    term.options.fontFamily = `${family}, monospace`;
    term.options.fontFamily = family;
    refit();
  };
  document.fonts.addEventListener("loadingdone", remeasure);
  setTimeout(remeasure, 300);
  setTimeout(remeasure, 1200);

  term.onData((d) => post({ t: "in", d }));
  // Old-style mouse reports are bytes, not text.
  term.onBinary((d) => post({ t: "bin", d: Array.from(d, (c) => c.charCodeAt(0) & 255) }));
  term.onTitleChange((d) => post({ t: "title", d }));

  // ⌘1–⌘8 the views, as the tabs (⌘8 this machine); ⌘+ ⌘− ⌘0 the type's size, kept for the next start.
  window.addEventListener("keydown", (e) => {
    if (!e.metaKey || e.ctrlKey || e.altKey) return;
    const n = Number(e.key);
    if (n >= 1 && n <= views.length) {
      e.preventDefault();
      go(views[n - 1].key);
      return;
    }
    const step = { "=": 1, "+": 1, "-": -1, "0": 0 }[e.key];
    if (step === undefined) return;
    e.preventDefault();
    const next = step === 0 ? look.size : Math.min(28, Math.max(9, term.options.fontSize + step));
    term.options.fontSize = next;
    store.set("fontSize", String(next));
    refit();
  }, true);

  // What the program printed, base64, from the app.
  window.out = (b64) => {
    const bin = atob(b64);
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    term.write(bytes);
  };
  // Files dropped on the window, their paths escaped: in as a paste — bracketed when the program
  // asked for that, so Claude Code takes a picture's path as the picture.
  window.dropped = (text) => { term.focus(); term.paste(text); };
  // The program ended: what it said stays on screen, the window closes behind it.
  window.ended = (why) => term.write(`\r\n\x1b[2m${why}\x1b[0m\r\n`);

  // Fonts first, so the first size is the right one; then cobserve is started at it.
  document.fonts.ready.then(() => {
    fit.fit();
    size = { cols: term.cols, rows: term.rows };
    term.focus();
    post({ t: "ready", cols: term.cols, rows: term.rows });
  });
  window.addEventListener("focus", () => term.focus());
})();
</script>
</body>
</html>

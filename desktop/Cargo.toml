[package]
name = "cobserve-desktop"
version = "0.1.0"
edition = "2024"
description = "cobserve in a window of its own: a terminal that runs it, with its own icon and menu."
publish = false

[[bin]]
name = "cobserve-desktop"
path = "src/main.rs"

[dependencies]
wry = "0.57"
tao = "0.37"
muda = "0.21"
portable-pty = "0.9"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

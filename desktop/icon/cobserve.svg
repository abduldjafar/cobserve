<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Beacon: a lighthouse whose tower is a stack of three database discs, on a night sea, its
       lamp sweeping a beam over the fleet's lights on the horizon, in the colours that mean
       something on screen. -->
  <defs>
    <linearGradient id="bodyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a2850"/>
      <stop offset="1" stop-color="#0a0f26"/>
    </linearGradient>
    <linearGradient id="rimGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="0.18" stop-color="#ffffff" stop-opacity="0.02"/>
      <stop offset="0.9" stop-color="#000000" stop-opacity="0.0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.22"/>
    </linearGradient>
    <clipPath id="bodyClip"><path d="M 628 100 c 103.61 0 155.41 0 194.99 20.16 a 185 185 0 0 1 80.85 80.85 c 20.16 39.57 20.16 91.38 20.16 194.99 L 924 628 c 0 103.61 0 155.41 -20.16 194.99 a 185 185 0 0 1 -80.85 80.85 c -39.57 20.16 -91.38 20.16 -194.99 20.16 L 396 924 c -103.61 0 -155.41 0 -194.99 -20.16 a 185 185 0 0 1 -80.85 -80.85 c -20.16 -39.57 -20.16 -91.38 -20.16 -194.99 L 100 396 c 0 -103.61 0 -155.41 20.16 -194.99 a 185 185 0 0 1 80.85 -80.85 c 39.57 -20.16 91.38 -20.16 194.99 -20.16 Z"/></clipPath>
  </defs>
  <path d="M 628 100 c 103.61 0 155.41 0 194.99 20.16 a 185 185 0 0 1 80.85 80.85 c 20.16 39.57 20.16 91.38 20.16 194.99 L 924 628 c 0 103.61 0 155.41 -20.16 194.99 a 185 185 0 0 1 -80.85 80.85 c -39.57 20.16 -91.38 20.16 -194.99 20.16 L 396 924 c -103.61 0 -155.41 0 -194.99 -20.16 a 185 185 0 0 1 -80.85 -80.85 c -20.16 -39.57 -20.16 -91.38 -20.16 -194.99 L 100 396 c 0 -103.61 0 -155.41 20.16 -194.99 a 185 185 0 0 1 80.85 -80.85 c 39.57 -20.16 91.38 -20.16 194.99 -20.16 Z" fill="url(#bodyGrad)"/>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c2a56"/>
      <stop offset="1" stop-color="#0e1636"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b3668"/>
      <stop offset="1" stop-color="#0a1432"/>
    </linearGradient>
    <linearGradient id="discSide" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f2f4fa"/>
      <stop offset="0.3" stop-color="#cfd5e4"/>
      <stop offset="0.75" stop-color="#8d96ad"/>
      <stop offset="1" stop-color="#5a6279"/>
    </linearGradient>
    <linearGradient id="galSide" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4b5369"/>
      <stop offset="1" stop-color="#1f2432"/>
    </linearGradient>
    <linearGradient id="lampSide" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff9e3"/>
      <stop offset="0.45" stop-color="#ffdf86"/>
      <stop offset="1" stop-color="#eaa92e"/>
    </linearGradient>
    <linearGradient id="roofSide" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5a6379"/>
      <stop offset="1" stop-color="#20253a"/>
    </linearGradient>
    <linearGradient id="beamGrad" x1="456" y1="0" x2="1000" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff3c6" stop-opacity="0.8"/>
      <stop offset="0.35" stop-color="#ffecb0" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#ffecb0" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="coreGrad" x1="456" y1="0" x2="1000" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff8dc" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#fff3c6" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#fff3c6" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="galLit" cx="456" cy="366" r="152" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#d9c58f"/>
      <stop offset="0.55" stop-color="#8f8f9c"/>
      <stop offset="1" stop-color="#5c657e"/>
    </radialGradient>
    <filter id="feather" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="7"/></filter>
    <filter id="featherWide" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="28"/></filter>
    <radialGradient id="lampGlow" cx="456" cy="322" r="250" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff6d2" stop-opacity="1"/>
      <stop offset="0.2" stop-color="#ffe9a6" stop-opacity="0.38"/>
      <stop offset="0.45" stop-color="#ffe08a" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#ffe08a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="reflect" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c3cadb" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#c3cadb" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="10"/></filter>
    <filter id="softer" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="26"/></filter>
  </defs>
  <g clip-path="url(#bodyClip)">
    <rect x="100" y="100" width="824" height="624" fill="url(#sky)"/>
    <circle cx="230" cy="230" r="3" fill="#e8ecff" fill-opacity="0.7"/>
<circle cx="300" cy="330" r="2" fill="#e8ecff" fill-opacity="0.7"/>
<circle cx="720" cy="190" r="2.5" fill="#e8ecff" fill-opacity="0.7"/>
<circle cx="800" cy="290" r="2" fill="#e8ecff" fill-opacity="0.7"/>
<circle cx="640" cy="160" r="2" fill="#e8ecff" fill-opacity="0.7"/>
<circle cx="860" cy="400" r="2" fill="#e8ecff" fill-opacity="0.7"/>
<circle cx="200" cy="470" r="2" fill="#e8ecff" fill-opacity="0.7"/>
<circle cx="560" cy="240" r="2" fill="#e8ecff" fill-opacity="0.7"/>
<circle cx="300" cy="560" r="1.5" fill="#e8ecff" fill-opacity="0.7"/>
<circle cx="180" cy="330" r="1.5" fill="#e8ecff" fill-opacity="0.7"/>
    <rect x="100" y="724" width="824" height="200" fill="url(#sea)"/>
    <line x1="100" y1="724" x2="924" y2="724" stroke="#5b79b8" stroke-opacity="0.5" stroke-width="2"/>
    <!-- the beam, its core, then the lamp's glow -->
    <path d="M 486 298 L 1040 170 L 1040 790 L 486 346 Z" fill="url(#beamGrad)" filter="url(#feather)"/>
    <path d="M 486 310 L 1040 330 L 1040 630 L 486 334 Z" fill="url(#coreGrad)" filter="url(#featherWide)"/>
    <circle cx="456" cy="322" r="260" fill="url(#lampGlow)"/>
    <!-- the fleet on the horizon, in the beam -->
    <circle cx="664" cy="716" r="30" fill="#8abe6c" fill-opacity="0.18" filter="url(#soft)"/>
<circle cx="664" cy="716" r="10" fill="#8abe6c"/>
<rect x="657" y="726" width="14" height="90" fill="#8abe6c" fill-opacity="0.35" style="filter:url(#soft)"/>
<circle cx="744" cy="716" r="30" fill="#f0b438" fill-opacity="0.18" filter="url(#soft)"/>
<circle cx="744" cy="716" r="10" fill="#f0b438"/>
<rect x="737" y="726" width="14" height="90" fill="#f0b438" fill-opacity="0.35" style="filter:url(#soft)"/>
<circle cx="850" cy="716" r="30" fill="#8abe6c" fill-opacity="0.18" filter="url(#soft)"/>
<circle cx="850" cy="716" r="10" fill="#8abe6c"/>
<rect x="843" y="726" width="14" height="90" fill="#8abe6c" fill-opacity="0.35" style="filter:url(#soft)"/>
    <!-- tower reflection and shadow on the water -->
    <rect x="334" y="730" width="244" height="170" fill="url(#reflect)"/>
    <ellipse cx="456" cy="734" rx="172" ry="24" fill="#000" fill-opacity="0.5" filter="url(#softer)"/>
    <!-- the tower: three database discs -->
    <path d="M 334 612 L 334 724 A 122 34 0 0 0 578 724 L 578 612 Z" fill="url(#discSide)"/>
<ellipse cx="456" cy="612" rx="122" ry="34" fill="#e4e8f2" stroke="#f7f8fc" stroke-width="2"/>
<path d="M 334 612 A 122 34 0 0 0 578 612" fill="none" stroke="#000" stroke-opacity="0.28" stroke-width="6"/>
<path d="M 334 500 L 334 612 A 122 34 0 0 0 578 612 L 578 500 Z" fill="url(#discSide)"/>
<ellipse cx="456" cy="500" rx="122" ry="34" fill="#e4e8f2" stroke="#f7f8fc" stroke-width="2"/>
<path d="M 334 500 A 122 34 0 0 0 578 500" fill="none" stroke="#000" stroke-opacity="0.28" stroke-width="6"/>
<path d="M 334 388 L 334 500 A 122 34 0 0 0 578 500 L 578 388 Z" fill="url(#discSide)"/>
<ellipse cx="456" cy="388" rx="122" ry="34" fill="#e4e8f2" stroke="#f7f8fc" stroke-width="2"/>
    <!-- gallery: the ledge under the lantern -->
    <path d="M 304 366 L 304 388 A 152 42 0 0 0 608 388 L 608 366 Z" fill="url(#galSide)"/>
    <ellipse cx="456" cy="366" rx="152" ry="42" fill="url(#galLit)" stroke="#8d97b0" stroke-width="2"/>
    <!-- the gallery's railing, along the front of the ledge -->
    <g stroke="#2a2f3f" stroke-opacity="0.85" stroke-linecap="round">
      <line x1="599.78" y1="372.77" x2="599.78" y2="346.77" stroke-width="3"/>
<line x1="587.22" y1="383.1" x2="587.22" y2="357.1" stroke-width="3"/>
<line x1="564.5" y1="392.1" x2="564.5" y2="366.1" stroke-width="3"/>
<line x1="533.37" y1="399.07" x2="533.37" y2="373.07" stroke-width="3"/>
<line x1="496.24" y1="403.49" x2="496.24" y2="377.49" stroke-width="3"/>
<line x1="456" y1="405" x2="456" y2="379" stroke-width="3"/>
<line x1="415.76" y1="403.49" x2="415.76" y2="377.49" stroke-width="3"/>
<line x1="378.63" y1="399.07" x2="378.63" y2="373.07" stroke-width="3"/>
<line x1="347.5" y1="392.1" x2="347.5" y2="366.1" stroke-width="3"/>
<line x1="324.78" y1="383.1" x2="324.78" y2="357.1" stroke-width="3"/>
<line x1="312.22" y1="372.77" x2="312.22" y2="346.77" stroke-width="3"/>
<path d="M 599.78 346.77 L 587.22 357.1 L 564.5 366.1 L 533.37 373.07 L 496.24 377.49 L 456 379 L 415.76 377.49 L 378.63 373.07 L 347.5 366.1 L 324.78 357.1 L 312.22 346.77" fill="none" stroke-width="3.5"/>
    </g>
    <!-- lantern room -->
    <path d="M 378 278 L 378 366 A 78 22 0 0 0 534 366 L 534 278 Z" fill="url(#lampSide)"/>
    <g stroke="#2a2f3f" stroke-width="5" stroke-opacity="0.7">
      <line x1="414" y1="282" x2="414" y2="378"/>
      <line x1="456" y1="300" x2="456" y2="388"/>
      <line x1="498" y1="282" x2="498" y2="378"/>
    </g>
    <!-- roof: a cone on the lantern -->
    <ellipse cx="456" cy="278" rx="96" ry="27" fill="#2c3245"/>
    <path d="M 360 278 L 456 194 L 552 278 A 96 27 0 0 1 360 278 Z" fill="url(#roofSide)"/>
    <circle cx="456" cy="188" r="11" fill="#5a6379"/>
  </g>

  <path d="M 628 100 c 103.61 0 155.41 0 194.99 20.16 a 185 185 0 0 1 80.85 80.85 c 20.16 39.57 20.16 91.38 20.16 194.99 L 924 628 c 0 103.61 0 155.41 -20.16 194.99 a 185 185 0 0 1 -80.85 80.85 c -39.57 20.16 -91.38 20.16 -194.99 20.16 L 396 924 c -103.61 0 -155.41 0 -194.99 -20.16 a 185 185 0 0 1 -80.85 -80.85 c -20.16 -39.57 -20.16 -91.38 -20.16 -194.99 L 100 396 c 0 -103.61 0 -155.41 20.16 -194.99 a 185 185 0 0 1 80.85 -80.85 c 39.57 -20.16 91.38 -20.16 194.99 -20.16 Z" fill="url(#rimGrad)"/>
  <path d="M 628 100 c 103.61 0 155.41 0 194.99 20.16 a 185 185 0 0 1 80.85 80.85 c 20.16 39.57 20.16 91.38 20.16 194.99 L 924 628 c 0 103.61 0 155.41 -20.16 194.99 a 185 185 0 0 1 -80.85 80.85 c -39.57 20.16 -91.38 20.16 -194.99 20.16 L 396 924 c -103.61 0 -155.41 0 -194.99 -20.16 a 185 185 0 0 1 -80.85 -80.85 c -20.16 -39.57 -20.16 -91.38 -20.16 -194.99 L 100 396 c 0 -103.61 0 -155.41 20.16 -194.99 a 185 185 0 0 1 80.85 -80.85 c 39.57 -20.16 91.38 -20.16 194.99 -20.16 Z" fill="none" stroke="#ffffff" stroke-opacity="0.07" stroke-width="2.5"/>

</svg>

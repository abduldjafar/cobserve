<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Tarum: a tile of soga-dyed cloth, a kawung in tarum indigo, and three of cobserve's thin
       bars in the dyes that mean something on screen. -->
  <defs>
    <linearGradient id="soga" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2c22"/>
      <stop offset="1" stop-color="#16120f"/>
    </linearGradient>
    <linearGradient id="tarum" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b8b6ff"/>
      <stop offset="1" stop-color="#6f6cd0"/>
    </linearGradient>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#soga)"/>
  <rect x="101.5" y="101.5" width="821" height="821" rx="184" fill="none" stroke="#f6eee0" stroke-opacity="0.10" stroke-width="3"/>
  <!-- kawung: four petals about a centre, the oldest of batik's motifs -->
  <g fill="url(#tarum)">
    <ellipse cx="512" cy="300" rx="78" ry="96"/>
    <ellipse cx="512" cy="484" rx="78" ry="96"/>
    <ellipse cx="420" cy="392" rx="96" ry="78"/>
    <ellipse cx="604" cy="392" rx="96" ry="78"/>
  </g>
  <circle cx="512" cy="392" r="34" fill="#2c2119"/>
  <g stroke-linecap="round" stroke-width="34">
    <line x1="262" y1="626" x2="762" y2="626" stroke="#4a3d32"/>
    <line x1="262" y1="626" x2="622" y2="626" stroke="#8abe6c"/>
    <line x1="262" y1="704" x2="762" y2="704" stroke="#4a3d32"/>
    <line x1="262" y1="704" x2="482" y2="704" stroke="#f0b438"/>
    <line x1="262" y1="782" x2="762" y2="782" stroke="#4a3d32"/>
    <line x1="262" y1="782" x2="702" y2="782" stroke="#f66e5a"/>
  </g>
</svg>

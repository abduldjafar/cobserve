# Logins for cobserve, one per server. Copy this file, fill it in, keep it private:
#
#   cp credentials.example.yaml credentials.yaml    # credentials.yaml is gitignored
#   chmod 600 credentials.yaml
#   cobserve --credential credentials.yaml    # or: cargo run --release -- --credential credentials.yaml
#
# Use read-only ClickHouse users (DESIGN.md §9). What this file says wins over the
# environment; CH_SEED_URLS, when set, adds servers to the list below.
#
# A password is read exactly as written — `:` `@` `/` `,` `%` and digits included, so
# `password: 007` is "007". Quote it when it starts with one of  " ' # { [ & * ! | > % @ `
# or holds " #" (space, then #): inside "double quotes" write \" and \\ for " and \,
# inside 'single quotes' write '' for '.

clickhouse:
  # Where discovery finds the rest of the fleet (system.clusters). Here or in CH_CLUSTER.
  cluster: ch_cluster

  # Each server with its own login.
  servers:
    - url: http://clickhouse1.example.net:8123
      user: monitor_ch1
      password: "change me"
    - url: http://clickhouse2.example.net:8123
      user: monitor_ch2
      password: "change me too"

  # Optional: the login for a server above that has no user/password of its own, and for
  # the hosts discovery finds that are not listed. Without it such a host is shown with a
  # note instead of being polled — no server is ever sent another server's password.
  # default_login:
  #   user: monitor
  #   password: "shared"

# Optional: the Redash queue. Otherwise REDASH_URL, REDASH_ADMIN_API_KEY, REDIS_URL and
# EMAIL_DOMAIN. People at email_domain are shown by name alone (grigol.gankava), everyone
# else by the whole address.
# redash:
#   url: https://redash.example.net
#   api_key: "admin API key"
#   redis_url: "redis://:password@redis-host:6379/0"
#   email_domain: example.net

# Optional: Airflow 2 for view 5. Otherwise AIRFLOW_URL, AIRFLOW_USER and AIRFLOW_PASSWORD.
# The login of its web UI: the API is signed into with the same form.
# airflow:
#   url: https://airflow.example.net
#   user: monitor
#   password: "change me"

# Optional: Jira Server or Data Center for view 6. Otherwise JIRA_URL and JIRA_TOKEN (with
# JIRA_STATUSES and JIRA_DONE_DAYS). The token is a personal access token: Profile → Personal
# Access Tokens. The columns are the board's, left to right; the last is where finished
# tickets go, and shows those resolved in the last done_days days.
# jira:
#   url: https://jira.example.net
#   token: "personal access token"
#   statuses: [In progress, In Review, Feedback, Done]
#   done_days: 7
